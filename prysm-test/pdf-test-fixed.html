      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      if (r > 180 && g > 100 && b < 100) return 'Ocre quemado';

    async function test1GenerateHTML() {
      log('========== PRUEBA 1: Generando HTML SIN foto ==========');
      try {
        generatedHTML = buildPdfHtml(TEST_DATA, false);

        const sizeKB = new Blob([generatedHTML]).size / 1024;
        log(`HTML generado: ${sizeKB.toFixed(2)} KB`);
        log(`Longitud del string: ${generatedHTML.length} caracteres`);

        // Contar páginas
        const pageCount = (generatedHTML.match(/class="page/g) || []).length;
        log(`Páginas detectadas: ${pageCount}`);

        // Verificar contenido
        const checks = [
          { name: 'PRYSM', found: generatedHTML.includes('PRYSM') },
          { name: 'Nombre usuario', found: generatedHTML.includes('PRUEBA PRYSM') },
          { name: 'Temporada', found: generatedHTML.includes('Otoño Profundo') },
          { name: 'Colores paleta', found: generatedHTML.includes('#D2691E') },
          { name: 'CSS', found: generatedHTML.includes('font-family') },
          { name: 'Cover page', found: generatedHTML.includes('class="page cover"') },
          { name: 'Outfits', found: generatedHTML.includes('Día a día') },
          { name: 'Silueta', found: generatedHTML.includes('Reloj de Arena') },
        ];

        log('\nVerificación de contenido:');
        checks.forEach(c => {
          log(`  ${c.found ? '✓' : '✗'} ${c.name}`);
        });

        const allPassed = checks.every(c => c.found);
        if (allPassed) {
          log('\n✅ HTML generado correctamente', 'success');
        } else {
          log('\n❌ HTML incompleto', 'error');
        }

        // Mostrar preview
        document.getElementById('htmlPreview').srcdoc = generatedHTML;
        document.getElementById('btnCheck').disabled = false;

      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      }
    }

    async function test3CheckHTML() {
      log('========== PRUEBA 3: Verificando HTML en detalle ==========');
      try {
        // Análisis más detallado
        const checks = {
          doctype: generatedHTML.includes('<!DOCTYPE html>'),
          head: generatedHTML.includes('<head>') && generatedHTML.includes('</head>'),
          body: generatedHTML.includes('<body>') && generatedHTML.includes('</body>'),
          fonts: generatedHTML.includes('fonts.googleapis.com'),
          css: generatedHTML.includes('<style>'),
          pages: (generatedHTML.match(/class="page [^"]*"/g) || []),
          images: (generatedHTML.match(/<img/g) || []).length,
          colors: (generatedHTML.match(/#[0-9A-Fa-f]{6}/g) || []).length
        };

        log(`DOCTYPE: ${checks.doctype ? '✓' : '✗'}`);
        log(`HEAD: ${checks.head ? '✓' : '✗'}`);
        log(`BODY: ${checks.body ? '✓' : '✗'}`);
        log(`FUENTES: ${checks.fonts ? '✓' : '✗'}`);
        log(`CSS: ${checks.css ? '✓' : '✗'}`);
        log(`IMÁGENES: ${checks.images}`);
        log(`COLORES HEX: ${checks.colors}`);
        log(`PÁGINAS: ${checks.pages.length}`);
        checks.pages.forEach((p, i) => log(`  Página ${i+1}: ${p}`));

        if (checks.pages.length >= 7) {
          log('\n✅ HTML tiene 7+ páginas', 'success');
          document.getElementById('btnPDF').disabled = false;
        } else {
          log(`\n❌ HTML tiene solo ${checks.pages.length} páginas, se esperaban 7+`, 'error');
        }

      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      }
    }

    async function test4GeneratePDF() {
      log('========== PRUEBA 4: Generando PDF real ==========');
      if (!generatedHTML) {
        log('Primero genera el HTML (prueba 1 o 2)', 'error');
        return;
      }

      try {
        log('Creando contenedor temporal...');

        // Crear contenedor
        const container = document.createElement('div');
        container.innerHTML = generatedHTML;
        container.style.position = 'absolute';
        container.style.left = '-9999px';
        container.style.top = '0';
        container.style.width = '210mm';
        container.style.background = '#ffffff';
        document.body.appendChild(container);

        // Esperar a que las imágenes carguen
        log('Esperando carga de imágenes...');
        const images = container.querySelectorAll('img');
        await Promise.all(Array.from(images).map(img => {
          return new Promise(resolve => {
            if (img.complete) resolve();
            else {
              img.onload = () => resolve();
              img.onerror = () => resolve();
            }
          });
        }));

        log('Iniciando generación de PDF con html2pdf.js...');
        log('Esto puede tomar unos segundos...');

        const startTime = Date.now();

        html2pdf()
          .set({
            margin: 0,
            filename: 'PRYSM-Test-Fijo.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: {
              scale: 2,
              useCORS: true,
              allowTaint: true,
              letterRendering: true,
            },
            jsPDF: {
              unit: 'mm',
              format: 'a4',
              orientation: 'portrait',
            },
            pagebreak: { mode: ['avoid-all', 'css', 'legacy'] },
          })
          .from(container)
          .outputPdf('blob')
          .then(blob => {
            const endTime = Date.now();
            const duration = (endTime - startTime) / 1000;

            generatedPDFBlob = blob;

            log(`\n✅ PDF generado en ${duration.toFixed(1)}s`, 'success');
            log(`Tamaño del PDF: ${(blob.size / 1024).toFixed(2)} KB`);
            log(`Tipo MIME: ${blob.type}`);

            // Verificar que es PDF válido
            const reader = new FileReader();
            reader.onload = () => {
              const header = reader.result.slice(0, 8);
              const isValidPDF = header.startsWith('%PDF');
              log(`PDF válido (header): ${isValidPDF ? '✓ Sí' : '✗ No'}`);

              if (isValidPDF) {
                document.getElementById('btnDownload').disabled = false;
              }
            };
            reader.readAsText(blob.slice(0, 100));

            // Limpiar
            document.body.removeChild(container);
          })
          .catch(err => {
            log(`Error generando PDF: ${err.message}`, 'error');
            document.body.removeChild(container);
          });

      } catch (err) {
        log(`Error: ${err.message}`, 'error');
      }
    }

    function test5DownloadPDF() {
      log('========== PRUEBA 5: Descargando PDF ==========');
      if (!generatedPDFBlob) {
        log('Primero genera el PDF (prueba 4)', 'error');
        return;
      }

      try {
        const url = URL.createObjectURL(generatedPDFBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'PRYSM-Test-Fijo.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        log('✅ PDF descargado correctamente', 'success');
        log('Archivo: PRYSM-Test-Fijo.pdf');

      } catch (err) {
        log(`Error descargando: ${err.message}`, 'error');
      }
    }
  </script>
